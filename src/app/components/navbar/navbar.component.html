<nav class="navbar">

  <!-- Menú izquierdo: Información y Ayuda (siempre visible) -->
  <div class="nav-group nav-left">
    <a [routerLink]="['/home']" fragment="informacion" class="nav-pill">Información</a>
    <a [routerLink]="['/home']" fragment="ayuda" class="nav-pill">Centro de ayuda</a>
  </div>

  <!-- Logo -->
  <a routerLink="/home" class="brand-logo">
    <img src="assets/LogoAirF.png" alt="Flight Finder" class="brand-img" />
    <span class="brand-name">Flight Finder</span>
  </a>

  <!-- Menú derecho: opciones según autenticación -->
  <div class="nav-group nav-right">
    <!-- Usuario NO autenticado -->
    <ng-container *ngIf="!usuarioAutenticado">
      <a [routerLink]="['/home']" fragment="ofertas" class="nav-pill">Ofertas</a>
      <a routerLink="/login" class="nav-pill btn-login">Iniciar sesión</a>
    </ng-container>

    <!-- Usuario autenticado -->
    <ng-container *ngIf="usuarioAutenticado">
      <button *ngIf="!estaEnBusquedaVuelos()" class="primary-btn" [class.plane-fly]="planeAnimating" (click)="irABuscarVuelos()">
        <span class="btn-text">Buscar Vuelos</span>
        <span class="btn-plane">✈️</span>
      </button>
      <a *ngIf="!estaEnHistorialBusquedas()" routerLink="/historial-busquedas" class="nav-pill">📱 Mis Búsquedas</a>
      <div class="user-menu" [class.crash-animation]="planeCrashing">
        <span class="username">{{ username }}</span>
        <button (click)="cerrarSesion()" class="nav-pill btn-logout" [disabled]="planeCrashing">Cerrar sesión</button>
        <div class="crash-plane" *ngIf="planeCrashing">✈️</div>
      </div>
    </ng-container>
  </div>

  <!-- Hamburger menu -->
  <button class="hamburger" (click)="toggleMenu()" aria-label="Abrir menú">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Mobile menu -->
  <div class="mobile-menu" [class.open]="menuOpen">
    <a [routerLink]="['/home']" fragment="informacion" (click)="menuOpen=false">Información</a>
    <a [routerLink]="['/home']" fragment="ayuda" (click)="menuOpen=false">Centro de ayuda</a>

    <!-- Mobile: Usuario NO autenticado -->
    <ng-container *ngIf="!usuarioAutenticado">
      <a [routerLink]="['/home']" fragment="ofertas" (click)="menuOpen=false">Ofertas</a>
      <a routerLink="/login" (click)="menuOpen=false" class="btn-login-mobile">Iniciar sesión</a>
    </ng-container>

    <!-- Mobile: Usuario autenticado -->
    <ng-container *ngIf="usuarioAutenticado">
      <button *ngIf="!estaEnBusquedaVuelos()" class="primary-btn-mobile" [class.plane-fly]="planeAnimating" (click)="irABuscarVuelos(); menuOpen=false">
        <span class="btn-text">Buscar Vuelos</span>
        <span class="btn-plane">✈️</span>
      </button>
      <a *ngIf="!estaEnHistorialBusquedas()" routerLink="/historial-busquedas" (click)="menuOpen=false">📱 Mis Búsquedas</a>
      <span class="mobile-username">{{ username }}</span>
      <button (click)="cerrarSesion()" class="btn-logout-mobile">Cerrar sesión</button>
    </ng-container>
  </div>

</nav>
